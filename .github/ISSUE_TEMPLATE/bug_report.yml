name: Bug report
description: Report an observed problem with safe, reproducible details.
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. Do not include secrets, personal data, or local paths."
  - type: textarea
    id: bug_summary
    attributes:
      label: Summary
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: bug_actual_behavior
    attributes:
      label: Actual behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: bug_expected_behavior
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: bug_reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest safe sequence that shows the problem.
    validations:
      required: true
  - type: textarea
    id: bug_environment
    attributes:
      label: Environment
      description: Provide only relevant, non-sensitive context.
    validations:
      required: true
  - type: textarea
    id: bug_diagnostics
    attributes:
      label: Sanitized logs or screenshots
      description: Optional. Remove secrets and personal data before sharing.
      placeholder: Paste sanitized diagnostics or describe an image.
    validations:
      required: false
  - type: textarea
    id: bug_context
    attributes:
      label: Additional context
      description: Add any other safe context.
    validations:
      required: false
  - type: checkboxes
    id: bug_duplicate_check
    attributes:
      label: Duplicate check
      options:
        - label: I searched existing issues for duplicates.
          required: true
  - type: checkboxes
    id: bug_no_secrets
    attributes:
      label: Safe disclosure
      options:
        - label: I removed secrets, credentials, tokens, personal data, and local paths.
          required: true
