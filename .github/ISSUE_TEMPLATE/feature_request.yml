name: Feature request
description: Propose an outcome by describing the problem first.
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. Do not include secrets, personal data, or local paths."
  - type: textarea
    id: feature_problem
    attributes:
      label: Problem
      description: What problem should be addressed?
    validations:
      required: true
  - type: textarea
    id: feature_outcome
    attributes:
      label: Desired outcome
      description: What useful result should the change provide?
    validations:
      required: true
  - type: textarea
    id: feature_solution
    attributes:
      label: Possible solution
      description: Optional. Describe a possible approach without requiring it.
    validations:
      required: false
  - type: textarea
    id: feature_alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe other ways to address the problem.
    validations:
      required: false
  - type: textarea
    id: feature_scope
    attributes:
      label: Scope
      description: What is in scope and out of scope?
    validations:
      required: true
  - type: textarea
    id: feature_context
    attributes:
      label: Additional context
      description: Optional. Add only safe, relevant context.
    validations:
      required: false
  - type: checkboxes
    id: feature_duplicate_check
    attributes:
      label: Duplicate check
      options:
        - label: I searched existing issues for duplicates.
          required: true
